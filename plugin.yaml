name: supadata-extract
version: 1.0.0
description: >
  Supadata web scrape rung for resilient-search: URL -> Markdown, 1 credit per page from the
  same 100-credit monthly pool the YouTube transcript plugin uses, so it sits after the larger
  free pools. Requires SUPADATA_API_KEY.
author: velis / Claude Code
license: MIT
kind: backend
provides_web_providers:
  - supadata
python_dependencies:
  - httpx>=0.27
requires_env:
  - SUPADATA_API_KEY
